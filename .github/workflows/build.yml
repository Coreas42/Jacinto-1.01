name: Build and Release Windows Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compilar con PyInstaller
      run: |
        pyinstaller build.spec

    - name: Comprimir Artefacto (.zip)
      shell: pwsh
      run: |
        Compress-Archive -Path dist/TheGaragePOS.exe -DestinationPath dist/TheGaragePOS_Win64.zip

    - name: Subir Binario como Artefacto del Build
      uses: actions/upload-artifact@v4
      with:
        name: TheGaragePOS-Binary
        path: dist/TheGaragePOS.exe

    - name: Publicar en GitHub Releases (Solo en Tags)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/TheGaragePOS_Win64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
